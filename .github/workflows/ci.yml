name: GKIA public module checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax validation
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Example run
        run: npm run example
